<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="white" filter="url(#shadow)"/>

  <!-- Shopping bag body -->
  <path d="M33 42 L36 68 H64 L67 42 Z" fill="none" stroke="#444" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Bag handle -->
  <path d="M41 42 C41 32 59 32 59 42" fill="none" stroke="#444" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Small clasp/button on bag -->
  <rect x="44" y="52" width="12" height="9" rx="4" ry="4" fill="none" stroke="#444" stroke-width="3"/>
</svg>
